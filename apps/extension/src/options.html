<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CurAnno settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --muted: #5f6368;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #9aa0a6;
          --error: #f2b8b5;
        }
      }
      body {
        font:
          14px/1.45 system-ui,
          sans-serif;
        margin: 1rem;
        min-width: 26rem;
        max-width: 36rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 1rem;
      }
      input[type='url'],
      input[type='text'] {
        box-sizing: border-box;
        width: 100%;
        padding: 0.35rem 0.5rem;
        margin-top: 0.25rem;
        font: inherit;
      }
      .hint {
        color: var(--muted);
        margin: 0.25rem 0 0;
      }
      .error {
        color: var(--error);
        margin: 0.25rem 0 0;
      }
      .error:empty {
        display: none;
      }
      .check {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        margin-top: 1rem;
      }
      .check label {
        margin-top: 0;
      }
      button {
        margin-top: 1.25rem;
        font: inherit;
        padding: 0.35rem 1rem;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid var(--muted);
        border-radius: 6px;
      }
      legend label.use {
        margin-top: 0;
      }
      details {
        margin-top: 1rem;
      }
      summary {
        cursor: pointer;
      }
      button.remove {
        margin-top: 0.75rem;
      }
      #status {
        margin-left: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <form id="settings" novalidate>
      <div id="servers"></div>
      <button type="button" id="add">Add server</button>

      <div class="check">
        <input
          id="publicCounts"
          name="publicCounts"
          type="checkbox"
          aria-describedby="publicCounts-hint"
        />
        <label for="publicCounts">Show public annotation counts</label>
      </div>
      <p class="hint" id="publicCounts-hint">
        While the guest is off, the badge shows how many public annotations each page has on the
        server in use. This sends the address of every page you visit to its API.
      </p>

      <button type="submit">Save</button><span id="status" role="status"></span>
    </form>

    <template id="server-template">
      <fieldset class="server">
        <legend>
          <label class="use"><input type="radio" name="activeServer" /> Use this server</label>
        </legend>
        <label data-for="name">Name</label>
        <input data-field="name" type="text" required />
        <p class="hint">Shown when you right-click the toolbar button to switch servers.</p>
        <p class="error" data-error="name" role="alert"></p>

        <label data-for="siteUrl">Site URL</label>
        <input data-field="siteUrl" type="url" required />
        <p class="hint">The CurAnno site's address, such as https://curanno.example.</p>
        <p class="error" data-error="siteUrl" role="alert"></p>

        <p class="hint" data-viewer role="status"></p>

        <details>
          <summary>Advanced</summary>
          <label data-for="sidebarUrl">Sidebar URL</label>
          <input data-field="sidebarUrl" type="url" />
          <p class="hint">Leave it empty to use /sidebar/ at the site.</p>
          <p class="error" data-error="sidebarUrl" role="alert"></p>

          <label data-for="pdfViewerUrl">PDF viewer URL</label>
          <input data-field="pdfViewerUrl" type="url" />
          <p class="hint">
            PDFs opened while the guest is on go here. Leave it empty to use the viewer the server
            names.
          </p>
          <p class="error" data-error="pdfViewerUrl" role="alert"></p>

          <label data-for="apiUrl">API origin</label>
          <input data-field="apiUrl" type="url" />
          <p class="hint">
            Used only for public counts. Leave it empty when the API is on the sidebar's origin.
          </p>
          <p class="error" data-error="apiUrl" role="alert"></p>
        </details>

        <button type="button" class="remove">Remove this server</button>
      </fieldset>
    </template>
    <script src="options.js"></script>
  </body>
</html>
